<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Out and About – Einloggen</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #fff;
      color: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
    }
    .box { text-align: center; padding: 2rem; max-width: 320px; width: 100%; }
    h1 { font-size: 1.6rem; margin-bottom: 0.5rem; }
    .subtitle { color: #666; margin-bottom: 1.5rem; font-size: 0.95rem; }
    form { display: flex; flex-direction: column; gap: 0.75rem; }
    input {
      padding: 10px 14px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
      font-family: inherit;
      width: 100%;
    }
    input:focus { outline: none; border-color: #333; }
    button {
      padding: 10px 32px;
      border-radius: 8px;
      background: #333;
      color: #fff;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      font-family: inherit;
      margin-top: 0.25rem;
    }
    button:hover { opacity: 0.85; }
    button:disabled { opacity: 0.45; cursor: default; }
    .error { color: #c00; font-size: 0.9rem; margin-top: 0.25rem; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Out and About</h1>
    <p class="subtitle">Bitte einloggen um fortzufahren.</p>
    <form id="login-form" novalidate>
      <input type="email" name="email" autocomplete="username" placeholder="E-Mail" required>
      <input type="password" name="password" autocomplete="current-password" placeholder="Passwort" required>
      <button type="submit" id="login-btn">Einloggen</button>
      <p class="error" id="error-msg" hidden></p>
    </form>
  </div>

  <script>
  (function () {
    function getRedirectTarget() {
      var params = new URLSearchParams(location.search);
      var target = params.get('redirect');
      if (!target || target.startsWith('//') || /^https?:\/\//i.test(target)) return '/';
      return target;
    }

    var form = document.getElementById('login-form');
    var btn  = document.getElementById('login-btn');
    var err  = document.getElementById('error-msg');

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      btn.disabled = true;
      err.hidden = true;

      var email    = form.elements.email.value.trim();
      var password = form.elements.password.value;

      fetch('/.netlify/identity/token', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams({ grant_type: 'password', username: email, password: password }),
      })
        .then(function (resp) {
          return resp.json().then(function (data) {
            if (!resp.ok) throw new Error(data.error_description || data.msg || 'Login fehlgeschlagen');
            return data;
          });
        })
        .then(function (data) {
          var maxAge = data.expires_in || 3600;
          document.cookie = 'nf_jwt=' + data.access_token + '; path=/; SameSite=Lax; Secure; max-age=' + maxAge;
          location.replace(getRedirectTarget());
        })
        .catch(function (e) {
          err.textContent = e.message;
          err.hidden = false;
          btn.disabled = false;
        });
    });
  }());
  </script>
</body>
</html>
